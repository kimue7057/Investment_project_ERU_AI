><div class="sim-actions"><p>곧바로 결과를 보고 싶다면 남은 구간의 재생을 마칠 수 있어요. 주요 대응은 결과 화면에서 다시 복기할 수 있어요.</p><button class="btn dark" data-action="finish">재생 마치고 결과 보기 <span>→</span></button></div></div>`;

  function results(){

hd*100)}</td><td>${percent(gd*100)}</td></tr><tr><td>종료 BTC·현금 비중</td><td>연결 후 표시</td><td>연결 후 표시</td></tr></tbody></table><p class="fine" style="margin-top:17px">최대 낙폭은 각 계좌의 고점 대비 가장 크게 하락한 비율이에요. 시작 투자금 대비 손익과는 다른 값이에요. 세 사이클의 손익을 합산하지 않아요.</p></section><section class="recovery-callout"><div><div class="eyebrow gold">WHY THE FALL MATTERS</div><h2>다시 회복하는 데<br>필요한 상승 폭도 달라져요.</h2><p>각 계좌의 최대 낙폭에서 이전 고점까지 돌아가는 데 필요한 자산 상승률이에요. 이후 시장 수익을 예측하는 값은 아니에요.</p></div><div class="recovery-numbers"><div><small>단순 보유 · 예시</small><b>+${((1/(1+hd)-1)*100).toFixed(1)}%</b><span>이전 고점 회복에 필요한 상승</span></div><div><small>리스크 가드 · 예시</small><b>+${((1/(1+gd)-1)*100).toFixed(1)}%</b><span>이전 고점 회복에 필요한 상승</span></div></div></section><div class="result-buttons"><button class="btn gold" data-action="review-cycle" data-cycle="${c}">${cycles[c].name} 대응 복기하기 <span>→</span></button><button class="btn light" data-action="new-amount">투자금 바꿔 다시 보기</button></div></div>`;
  }
  function review(){

    const c=state.cycle,e=events[state.event],amount=state.run.amount,a=sampleAt(c,'hold',e.p)*amount,b=sampleAt(c,'guard',e.p)*amount;
    return `<div class="wrap page">${steps(3)}<div class="page-head"><div><div class="eyebrow">A REASON BEHIND EVERY CHANGE</div><h1>그때, 어떻게 움직였을까요?</h1><p>당시 상황부터 실제 대응, 이후의 변화까지 한 장면씩 살펴봐요.</p></div>${tabs('review-cycle')}</div><div class="review-layout"><div><section class="card chart-card"><div class="topline"><h2>${cycles[c].name}</h2>${sampleBadge()}</div><p class="chart-meta">${cycles[c].period} · 번호를 선택하면 해당 장면이 열려요.</p><div class="chart-frame">${chart(c,{markers:true,selected:state.event})}</div>${legend()}<div class="review-timeline" role="group" aria-label="주요 대응 장면">${events.map((ev,i)=>`<button class="${state.event===i?'active':''}" data-action="select-event" data-index="${i}" aria-pressed="${state.event===i}"><span class="event-number">${i+1}</span>${ev.type}</button>`).join('')}</div><div class="playback-caption"><span>시안에서는 주요 6장면을 살펴볼 수 있어요.</span><span>실제 연결 시 최대 20개 요약</span></div></section><p class="review-footnote">이 시안의 사건과 자산 곡선은 흐름 설명용이에요. 실제 체결 날짜·수량·가격과 거래 사유는 데이터 연결 후 표시해요. 같은 시점의 자산 차이를 개별 대응 하나의 확정 기여액으로 해석하지 않아요.</p></div><aside class="review-explanation" aria-live="polite"><span class="event-type">장면 ${state.event+1} / ${events.length} · ${e.type}</span><h2>${e.title}</h2><div class="explanation-content"><div><div class="explanation-row"><small>01 / 당시 신호</small><p>${e.signal}</p></div><div class="explanation-row"><small>02 / 가드의 대응</small><p>${e.action}</p></div><div class="explanation-row"><small>03 / 이후 변화</small><p>${e.after}</p></div></div><div><div class="explanation-row"><small>대응 후 BTC·현금 구성</small><div class="composition" aria-label="보유 구성 표시 예시"><span style="width:${e.btc*100}%"></span><span style="width:${(1-e.btc)*100}%"></span></div><div class="composition-key"><span>비트코인</span><span>현금</span></div><p class="fine" style="margin-top:10px">비중은 실제 계산 후 표시해요.</p></div><div class="snapshot"><small>선택한 시점의 자산 · 예시</small><div class="result-row"><span>단순 보유</span><b>${money(a)}</b></div><div class="result-row"><span>리스크 가드</span><b>${money(b)}</b></div></div></div></div><div style="display:flex;gap:10px;margin-top:22px"><button class="btn light" data-action="previous-review" ${state.event===0?'disabled':''} style="flex:1">← 이전</button><button class="btn dark" data-action="next-review" ${state.event===events.length-1?'disabled':''} style="flex:1">다음 →</button></div><button class="text-link" data-action="all-events" style="margin-top:17px">시연 대응 내역 모두 보기 ↗</button></aside></div><div class="review-next"><div><h3>기다린 자금은 어떻게 다시 움직였을까요?</h3><p>‘다시 매수’ 장면에서 재진입과 이후 회복 과정을 이어서 살펴보세요.</p></div><button class="btn light" data-action="select-event" data-index="4">재진입 장면 보기 →</button></div><div class="result-buttons"><button class="btn dark" data-action="next-cycle-review">${c<2?'다음 사이클 복기하기':'1차 사이클 다시 보기'} <span>→</span></button><button class="btn light" data-action="results">세 사이클 결과로 돌아가기</button></div></div>`;
  }
  function recordsPage(){return `<div class="wrap page"><div class="page-head"><div><div class="eyebrow">MY SIMULATIONS</div><h1>다시 꺼내 보는 나의 비교.</h1><p>이 브라우저에만 저장한 시연 기록이에요. 본 서비스의 계정 보관 화면을 미리 살펴봐요.</p></div><button class="btn dark" data-action="new-amount">새 투자금으로 비교 <span>↗</span></button></div>${records.length?`<div class="record-list">${records.map(r=>`<article class="record-card"><div class="topline"><span class="status">${r.progress>=300?'비교 완료':'재생 중 · 이어보기'}</span><small class="fine">${new Date(r.created).toLocaleDateString('ko-KR')}</small></div><h2>${money(r.amount)}</h2><p>비트코인 · 세 사이클 독립 비교 · 화면 예시</p><div class="composition" aria-label="${Math.floor(r.progress/3)}% 진행"><span style="width:${r.progress/3}%"></span><span style="width:${100-r.progress/3}%;background:#edf1f7"></span></div><p>${Math.floor(r.progress/3)}% 진행 · 로컬 시연 기록</p><div class="record-actions"><button class="btn dark" data-action="open-record" data-id="${escape(r.id)}">${r.progress>=300?'결과 다시 보기':'이어서 재생'} →</button>${r.progress>=300?`<button class="btn light" data-action="open-review-record" data-id="${escape(r.id)}">대응 복기</button>`:''}</div></article>`).join('')}</div>`:`<section class="card records-empty"><img src="${LOGO}" alt="Risk Guard"><h2>첫 번째 비교를 시작해 볼까요?</h2><p>내 투자금을 입력하고 세 번의 시장을 살펴보세요.</p><button class="btn dark" data-action="begin">시뮬레이터 시작 →</button></section>`}</div>`;}
  function missingRun(message='내 투자금을 먼저 입력해 주세요.'){return `<div class="wrap page"><section class="card records-empty"><img src="${LOGO}" alt=""><h2>${message}</h2><p>단순 보유와 가드 적용 결과를 내 투자금으로 살펴봐요.</p><button class="btn dark" data-action="begin">비교 시작하기 →</button></section></div>`;}
  function route(){const p=location.hash.slice(1)||'home';return ['home','auth','amount','simulation','results','review','records'].includes(p)?p:'home';}
  function navigate(to){if(route()===to)render();else location.hash=to;}

  function startRun(amount){state.run={id:'demo-'+Date.now()+'-'+Math.random().toString(16).slice(2,8),amount,progress:0,created:Date.now()};state.cycle=0;state.event=0;state.playing=true;saveRun();navigate('simulation');}
  function finish(){if(!state.run)return begin();state.playing=false;state.run.progress=300;if(!saveRun())toast('이 브라우저에 기록을 저장하지 못했어요. 현재 화면에서는 계속 볼 수 있어요.');navigate('results');}
  function render(){
    const page=route();if(page!=='simulation'){state.playing=false;saveRun();}

    app.innerHTML=views[page]();app.className='screen-enter';
    document.querySelectorAll('[data-nav]').forEach(el=>{const yes=el.dataset.nav===page||(el.dataset.nav==='home'&&['auth','amount','simulation'].includes(page))||(el.dataset.nav==='results'&&page==='review');el.classList.toggle('active',yes);if(yes)el.setAttribute('aria-current','page');else el.removeAttribute('aria-current');});

  function updateSim(){

    const btn=app.querySelector('[data-action="play"]');btn.textContent=state.playing?'Ⅱ':'▶';btn.setAttribute('aria-label',state.playing?'재생 일시정지':'재생 시작');

  }
  function closeModal(){document.getElementById('modal-root').innerHTML='';for(const el of [app,document.querySelector('.site-header'),document.querySelector('.prototype-bar'),document.querySelector('.site-footer')])el.inert=false;document.body.style.overflow='';if(previousFocus?.isConnected)previousFocus.focus({preventScroll:true});}
  function flow(){modal('전체 흐름을 한눈에 살펴보세요.',`<p>각 단계를 바로 열어 화면과 이동을 확인할 수 있어요.</p><ol class="flow-list">${[['home','처음 만나는 시뮬레이터','비트코인과 세 사이클의 비교 소개'],['auth','이메일 인증','메일 입력과 인증번호 화면 시연'],['amount','내 투자금 입력','금액 하나로 세 사이클을 독립 비교'],['simulation','두 계좌 자동 비교','멈추지 않는 대응과 자산 곡선'],['results','세 사이클 결과','남은 자산·손익·최대 낙폭 비교'],['review','대응 과정 복기','당시 신호·대응·이후 변화'],['records','나의 시연 기록','결과 다시 보기와 중간 재생 이어보기']].map(([page,title,description],i)=>`<li><span>${String(i+1).padStart(2,'0')}</span><div><b>${title}</b><p>${description}</p></div><button data-action="preview-page" data-page="${page}">열기 ↗</button></li>`).join('')}</ol><p class="fine">실제 서비스를 연결하지 않은 독립 시안이에요. 바로 열기에는 1천만 원의 예시 화면을 사용해요.</p>`);}
  function method(){modal('시안의 계산 기준',`<p>브랜드와 화면 흐름을 검토하기 위한 독립 HTML 프로토타입이에요.</p><ul class="method-list"><li>사이클 기간은 전달받은 엑셀의 세 구간을 사용해요.</li><li>그래프와 대응 장면은 임의의 화면 예시예요. 실제 BTC 시세나 전략 성과가 아니에요.</li><li>입력한 금액에 비례해 예시 금액을 표시해요. 시안에는 가드의 결과가 단순 보유보다 낮은 사례도 포함했어요.</li><li>BTC 전용 초기 현금 비중, 실제 수수료·이자·환율·체결 시점은 아직 연결하지 않았어요.</li><li>실제 구현에서는 BTC 단독 전략을 다시 계산하고 같은 시점의 두 계좌를 비교해야 해요.</li><li>최대 낙폭과 회복 필요 상승률도 화면의 예시 곡선에서 계산한 값이에요.</li><li>이메일을 발송하지 않으며, 시연 기록은 이 브라우저의 별도 저장 공간에만 보관해요.</li><li>기존 운영 서비스와 인증·기록·시세를 공유하지 않아요.</li></ul><button class="btn dark" data-action="close-modal">확인했어요</button>`);}
  function allEvents(){modal('대응 장면 전체 보기',`<p>${cycles[state.cycle].name} · 흐름 검토용 6개 예시 장면</p><table class="all-events"><thead><tr><th>장면</th><th>대응</th><th>확인할 내용</th></tr></thead><tbody>${events.map((e,i)=>`<tr><td><button class="text-link" data-action="modal-event" data-index="${i}">${i+1}번 ↗</button></td><td>${e.type}</td><td>${e.action}</td></tr>`).join('')}</tbody></table><p class="fine" style="margin-top:20px">실제 체결 날짜·가격·수량은 원본 시세 및 BTC 전용 장부 연결 후 제공해요.</p>`);}
  document.addEventListener('submit',e=>{
    if(e.target.id==='auth-form'){
      e.preventDefault();if(state.authStep==='email'){const input=document.getElementById('auth-email');if(!input.checkValidity())return input.reportValidity();state.email=input.value.trim();state.authStep='code';render();document.getElementById('auth-code').focus();}
      else if(document.getElementById('auth-code').value==='000000')demoAuth();else document.getElementById('auth-error').textContent='시연 인증번호 000000을 입력해 주세요.';
    }
    if(e.target.id==='amount-form'){
      e.preventDefault();const raw=document.getElementById('amount-input').value.replaceAll(',','').trim(),value=Number(raw);
      if(!/^\d+$/.test(raw)||!Number.isSafeInteger(value)||value<10000||value>MAX_AMOUNT){document.getElementById('amount-error').textContent='1만 원부터 100억 원까지 숫자로 입력해 주세요.';document.getElementById('amount-input').focus();return;}
      state.amountDraft=value;startRun(value);
    }
  });
  document.addEventListener('input',e=>{if(e.target.id==='sim-progress'&&state.run){state.playing=false;state.run.progress=Number(e.target.value);if(state.run.progress>=300)finish();else{const cycle=Math.min(2,Math.floor(state.run.progress/100));if(cycle!==state.cycle){state.cycle=cycle;render();document.getElementById('sim-progress').focus({preventScroll:true});}else updateSim();saveRun();}}});
  document.addEventListener('click',e=>{
    if(e.target.classList.contains('modal-backdrop'))return closeModal();
    const el=e.target.closest('[data-action]');if(!el||el.disabled)return;const a=el.dataset.action;
    if(a==='begin')begin();else if(a==='home')navigate('home');else if(a==='flow')flow();else if(a==='method')method();else if(a==='close-modal')closeModal();else if(a==='demo-auth')demoAuth();else if(a==='change-email'){state.authStep='email';render();}
    else if(a==='preset'){state.amountDraft=Number(el.dataset.amount);document.getElementById('amount-input').value=state.amountDraft.toLocaleString('ko-KR');app.querySelectorAll('[data-action="preset"]').forEach(x=>x.classList.toggle('selected',x===el));document.getElementById('amount-error').textContent='';}
    else if(a==='play'){state.playing=!state.playing;updateSim();}
    else if(a==='speed'){state.speed=Number(el.dataset.speed);app.querySelectorAll('[data-action="speed"]').forEach(x=>{x.classList.toggle('active',x===el);x.setAttribute('aria-pressed',x===el?'true':'false');});}
    else if(a==='finish')finish();else if(a==='resume'){state.playing=true;navigate('simulation');}
    else if(a==='next-event'&&state.run){const t=state.run.progress-state.cycle*100,next=events.find(x=>x.p>t+.01);state.playing=false;state.run.progress=next?state.cycle*100+next.p:Math.min(300,(state.cycle+1)*100);if(state.run.progress>=300)finish();else{state.cycle=Math.min(2,Math.floor(state.run.progress/100));render();saveRun();}}
    else if(a==='seek-event'&&state.run){state.playing=false;state.run.progress=state.cycle*100+events[Number(el.dataset.index)].p;render();saveRun();}
    else if(a==='sim-cycle'&&state.run){state.cycle=Number(el.dataset.cycle);state.playing=false;state.run.progress=state.cycle*100;render();saveRun();}
    else if(a==='result-cycle'){state.cycle=Number(el.dataset.cycle);render();document.getElementById('result-detail').scrollIntoView({behavior:'smooth',block:'start'});}
    else if(a==='review-cycle'){state.cycle=Number(el.dataset.cycle);state.event=0;navigate('review');}
    else if(a==='select-event'){
      if(route()==='simulation'){state.playing=false;updateSim();const i=Number(el.dataset.index);modal(events[i].title,`<p>${events[i].action}</p><p class="fine" style="margin-top:20px">자동 대응 장면의 예시예요. 비교를 마치면 전체 흐름을 복기할 수 있어요.</p><button class="btn dark" data-action="close-modal" style="margin-top:22px">이어서 살펴보기</button>`);}
      else setReview(Number(el.dataset.index));
    }
    else if(a==='previous-review')setReview(state.event-1);else if(a==='next-review')setReview(state.event+1);else if(a==='next-cycle-review'){state.cycle=(state.cycle+1)%3;state.event=0;render();window.scrollTo({top:0,behavior:'smooth'});}
    else if(a==='all-events')allEvents();else if(a==='modal-event'){const i=Number(el.dataset.index);closeModal();setReview(i);}
    else if(a==='results')navigate('results');else if(a==='records')navigate('records');else if(a==='new-amount'){state.amountDraft=state.run?.amount||10000000;begin();}
    else if(a==='open-record'||a==='open-review-record')openRecord(el.dataset.id,a==='open-review-record');
    else if(a==='preview-page'){
      const page=el.dataset.page;closeModal();if(['amount','simulation','results','review'].includes(page)){state.authenticated=true;try{sessionStorage.setItem(AUTH,'1');}catch{}}
      if(['simulation','results','review'].includes(page)){
        state.run={id:'preview-'+Date.now(),amount:state.amountDraft,progress:page==='simulation'?35:300,created:Date.now()};state.cycle=0;state.event=2;state.playing=false;saveRun();
      }
      if(page==='auth')state.authStep='email';navigate(page);
    }
  });
  document.addEventListener('keydown',e=>{
    const modalEl=document.querySelector('.modal');if(modalEl){if(e.key==='Escape'){e.preventDefault();closeModal();}else if(e.key==='Tab'){const nodes=[...modalEl.querySelectorAll('button:not(:disabled),a[href],input')];const first=nodes[0],last=nodes.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}return;}
    if((e.key==='Enter'||e.key===' ')&&e.target.matches('.chart-marker')){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}));}
  });
  window.addEventListener('hashchange',render);
  matchMedia('(max-width:600px)').addEventListener('change',()=>{if(['simulation','results','review'].includes(route()))render();});
  document.addEventListener('visibilitychange',()=>{if(document.hidden&&state.playing){state.playing=false;saveRun();updateSim();}});
  window.addEventListener('pagehide',()=>saveRun());
  let lastTick=performance.now();setInterval(()=>{const now=performance.now(),dt=Math.min(.5,(now-lastTick)/1000);lastTick=now;if(!state.playing||!state.run||route()!=='simulation')return;state.run.progress=Math.min(300,state.run.progress+state.speed*dt);if(state.run.progress>=300){finish();return;}updateSim();if(now-lastSave>1500){saveRun();lastSave=now;}},250);
  render();
})();

</script>
</body>
</html>
