<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content"/>
  <meta name="referrer" content="no-referrer"/>
  <meta name="theme-color" content="#0c121e"/>
  <meta name="description" content="Compare Bitcoin buy-and-hold with Risk Guard across three historical cycles."/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="RiskGuard"/>
  <link rel="manifest" href="/manifest.webmanifest"/>
  <link rel="apple-touch-icon" href="/assets/riskguard-icon-192.png"/>
  <link rel="icon" href="/assets/riskguard-logo.webp"/>
  <title>Bitcoin Risk Guard · Results</title>
</head>
<body>
  <div class="report-shell">
  <header class="report-site-header"><button class="report-brand" data-action="top" aria-label="Risk Guard"><img src="/assets/riskguard-logo.webp" alt=""><span>RiskGuard<small>ERU AI</small></span></button><div class="report-header-actions"><button id="report-email-settings" data-action="edit-email" hidden>Email</button><button id="report-language" data-action="language">한국어</button></div></header>
  <main id="app" class="report-root" tabindex="-1"></main>
  </div>
  <div id="splash" role="dialog" aria-modal="true" aria-label="Risk Guard intro" hidden></div><div id="modal-root"></div><div id="toast" role="status" aria-live="polite"></div>
  <noscript>Please enable JavaScript to use the simulator. / JavaScript를 켜 주세요.</noscript>
  <script type="module" src="/src/bitcoin/reportMain.js"></script>
</body>
</html>
